[pytest]
# Configuración de pytest para ProyectoStaffAumentado

# Directorios de tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers personalizados
markers =
    unit: Tests unitarios rápidos
    integration: Tests de integración
    slow: Tests que toman tiempo
    requires_azure: Tests que requieren conexión a Azure

# Configuración de cobertura (si se instala pytest-cov)
# addopts = -v --cov=backend --cov=config --cov-report=html --cov-report=term

# Ignorar warnings específicos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
