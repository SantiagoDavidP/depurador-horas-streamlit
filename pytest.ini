[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:asyncio
markers =
    unit: Fast unit tests for domain/application/api helpers.
    contract: API contract tests without server process.
    integration: Integration-light tests within local process.
    slow: Longer-running tests.
    requires_sql: Tests that touch SQL adapter behavior or SQL deps.
    requires_azure: Tests requiring Azure credentials/resources.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
