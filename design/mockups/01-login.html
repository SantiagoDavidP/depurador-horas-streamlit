<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BONAPHARM Automatización</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1D4ED8', hover: '#1E40AF', light: '#DBEAFE' },
            accent: { DEFAULT: '#0EA5E9', hover: '#0284C7' },
            success: { DEFAULT: '#059669', light: '#D1FAE5' },
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-50 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <!-- Login Container -->
  <div class="w-full max-w-md">

    <!-- Logo & Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-2xl mb-4 shadow-lg shadow-blue-200">
        <i data-lucide="activity" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-900">BONAPHARM</h1>
      <p class="text-slate-600 text-sm mt-2">Sistema de Pedidos y Devoluciones</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
      <h2 class="text-xl font-semibold text-slate-900 mb-6">Iniciar Sesión</h2>

      <!-- Form -->
      <form class="space-y-5">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Correo Electrónico</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
            <input
              id="email"
              type="email"
              placeholder="usuario@bonapharm.com"
              class="w-full pl-11 pr-4 py-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
              value="vendedor@bonapharm.com"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
            <a href="#" class="text-xs text-primary hover:text-primary-hover cursor-pointer transition-colors">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              class="w-full pl-11 pr-4 py-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
            />
          </div>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center">
          <input
            id="remember"
            type="checkbox"
            class="w-4 h-4 text-primary border-slate-300 rounded focus:ring-2 focus:ring-primary/20 cursor-pointer"
          />
          <label for="remember" class="ml-2 text-sm text-slate-600 cursor-pointer">Recordar mi sesión</label>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full flex items-center justify-center gap-2 bg-primary text-white py-3 rounded-lg font-semibold text-sm hover:bg-primary-hover cursor-pointer transition-all duration-200 shadow-lg shadow-blue-200 hover:shadow-xl"
        >
          <i data-lucide="log-in" class="w-5 h-5"></i>
          Iniciar Sesión
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-white px-3 text-slate-500">O continuar con</span>
        </div>
      </div>

      <!-- Microsoft SSO -->
      <button
        type="button"
        class="w-full flex items-center justify-center gap-3 border border-slate-300 py-3 rounded-lg font-medium text-sm text-slate-700 hover:bg-slate-50 cursor-pointer transition-colors"
      >
        <svg class="w-5 h-5" viewBox="0 0 23 23" fill="none">
          <path d="M0 0h11v11H0V0z" fill="#F25022"/>
          <path d="M12 0h11v11H12V0z" fill="#7FBA00"/>
          <path d="M0 12h11v11H0V12z" fill="#00A4EF"/>
          <path d="M12 12h11v11H12V12z" fill="#FFB900"/>
        </svg>
        Microsoft Entra ID
      </button>

      <!-- Help Text -->
      <p class="text-center text-xs text-slate-500 mt-6">
        Acceso exclusivo para personal autorizado de BONAPHARM.<br>
        <a href="#" class="text-primary hover:underline cursor-pointer">Contactar soporte técnico</a>
      </p>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 mt-6">
      © 2025 BONAPHARM DEL PERÚ. Todos los derechos reservados.<br>
      Protegido por Azure AD • TLS 1.2+ • AES-256
    </p>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
